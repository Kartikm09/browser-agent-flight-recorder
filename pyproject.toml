[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent-flight-recorder"
version = "0.1.0"
description = "Local trace classifier for browser-agent tasks, risky UI actions, and approval-card generation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kartik Mishra"}]
keywords = ["ai-agents", "evaluation", "automation", "github-portfolio", "python"]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_agent_flight_recorder*"]
